spring.application.name=cooperative-backend
server.port=8081

# Database Connection (MySQL)
# Connecting to cooperative_db as specified
spring.datasource.url=jdbc:mysql://localhost:3306/cooperative_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Using Environment Variables for Credentials
# If DB_USERNAME or DB_PASSWORD is not set, it defaults to 'root' and an empty password
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Show error details
server.error.include-message=always
server.error.include-stacktrace=always

# Neo4j Graph Database Connection (DA3)
neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
neo4j.database=${NEO4J_DATABASE:neo4j}
neo4j.username=${NEO4J_USERNAME:}
neo4j.password=${NEO4J_PASSWORD:}
